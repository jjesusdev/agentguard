[project]
name = "agentguard"
version = "1.0.0"
description = "Auditoría forense inmutable para agentes de coding en YOLO mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
